name: AIS relay
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python ais_relay.py
        env:
          AIS_KEY: ${{ secrets.AIS_KEY }}
          LAYER_URL: ${{ secrets.LAYER_URL }}
          AGOL_USER: ${{ secrets.AGOL_USER }}
          AGOL_PASS: ${{ secrets.AGOL_PASS }}
